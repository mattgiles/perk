# perk project config (committed). Edit freely; per-user overrides go in
# .perk/local.toml (gitignored). Schema principle: every top-level header
# answers one operator question; structure encodes relationships (model
# precedence is visible as nesting).

# ═══ Which AI runs where (precedence = nesting: flag > stage > default) ═══

[models.subagents]
pr-reviewer = "openai/gpt-5.6-sol"
review-classifier = "openai/gpt-5.6-sol"
objective-explorer = "openai/gpt-5.6-terra"
conflict-resolver = "openai/gpt-5.6-luna"
learn-analyst = "openai/gpt-5.6-luna"
adversarial-reviewer = "openai/gpt-5.6-sol"
review-angle-selector = "openai/gpt-5.6-terra"

# ═══ How work is verified — and whether it's trusted ═══

[ci]
# This is our own repo — run the [[ci.checks]] below without a per-session confirm.
trusted = true

# perk's own dogfood CI checks. The `run_ci` tool / `/ci` command run these named checks and
# REPORT pass/fail — they never edit or fix. Each [[ci.checks]] row is name/command/optional
# glob; a check with a `glob` is SKIPPED on the run-all path when no changed file (vs trunk)
# matches it, so a docs-only change reports success fast. Checks run CONCURRENTLY and report in
# declared order — each row must be independently runnable (put an ordered sequence inside one
# `command`, e.g. "build && test"). Project-supplied CI is untrusted by
# default: an interactive session prompts to confirm (per-session latch), and headless runs need
# `--allow-project-ci` — unless `trusted = true` above opts the whole repo in. These rows mirror
# `just ci`'s verification targets (lint/typecheck/test/changelog-check); `setup` is environment
# prep, not a verification check — it is owned by the [worktree] setup hook below.
[[ci.checks]]
name = "lint-py"
command = "just lint-py"
glob = "*.py"

[[ci.checks]]
name = "lint-js"
command = "just lint-js"
glob = "*.ts,*.tsx,*.js,*.jsx,*.mjs"

[[ci.checks]]
name = "typecheck-py"
command = "just typecheck-py"
glob = "*.py"

[[ci.checks]]
name = "typecheck-js"
command = "just typecheck-js"
glob = "*.ts,*.tsx,*.js,*.jsx"

[[ci.checks]]
name = "test-py"
command = "just test-py"
glob = "*.py"

[[ci.checks]]
name = "test-js"
command = "just test-js"
glob = "*.ts,*.tsx,*.js,*.jsx,*.mjs"

[[ci.checks]]
name = "changelog-check"
command = "just changelog-check"
glob = "CHANGELOG.md"

# ═══ How the loop fits this repo ═══

# Stage exposure for borrowed external skills (contracts.md §8.39). These rows scope which cold
# stage launches see each skill in the model-invocable catalog — frontmatter `stages:` is the
# preferred lever, but these skills are synced byte-identical from upstream (frontmatter is
# upstream-owned), so the config layer scopes them instead. Perk-owned skills (`skills/`,
# `.perk/skills/`) declare `stages:` in their own SKILL.md frontmatter. Bound skills are always
# exposed at their trigger regardless of these rows. An empty list = interactive-only (exposed to
# no cold stage launch).
[skills.stages]
ast-grep = ["plan", "objective-plan", "objective-author", "implement", "address", "learn"]
ruff = ["implement", "address"]
ty = ["implement", "address"]
uv = ["implement", "address"]
dignified-python = ["plan", "objective-plan", "implement", "address"]
mastering-typescript = ["plan", "objective-plan", "implement", "address"]
codebase-design = ["plan", "objective-plan", "objective-author"]
agent-browser = []
# Package-bundled skills (gitignored `.pi/npm` tier — sanctioned by the static PACKAGE_SKILLS
# literal in tests/test_skill_declarations.py). `pi-subagents` mirrors where the `subagent` tool
# lives (the worktree stages); `librarian` follows the deep-research stages.
pi-subagents = ["implement", "submit", "address", "land", "learn"]
librarian = ["plan", "objective-plan", "objective-author", "implement", "address"]

# ═══ Where work happens ═══

[worktree]
# Where `perk worktree create` and cold-door stages place worktrees.
# Relative paths resolve against the repo root.
root = ".worktrees"
# Shell commands run once inside a freshly created worktree before `exec pi`. `uv sync
# --all-packages` installs every workspace member (without it a fresh worktree hits the member-
# pruning trap: `No module named 'perk_dev'`); `npm ci` installs this worktree's own node_modules
# so it never resolves the main checkout's (stale-SDK) tree by walk-up. Steady-state launches skip
# it (fresh-create only).
setup = ["uv sync --all-packages", "npm ci"]

# ═══ Which pluggable piece fills each seam ═══

[providers]
footer = "perk-footer"
plan = "plannotator-plan"
