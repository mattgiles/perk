# Session-audit expectation catalog. Loaded by perk_dev.audit.expectations.load_catalog();
# the loader + its validate() content pass are the executable spec (self-checked by
# tests/test_perk_dev_expectations.py).
#
# Each entry ("in a session where stage/door X ran, we expect evidence Y; a violation
# looks like Z"):
#
#   id:            stable slug id — lowercase alnum runs joined by `.` or `-`
#                  (^[a-z0-9]+(?:[.-][a-z0-9]+)*$); unique across the catalog.
#   kind:          one of: tool-mechanics | prompt-adherence | workflow-shape | skill-uptake
#   surface:       short human name of the intent surface the expectation derives from.
#   source:        durable repo-relative pointer to that surface: "<path>" or
#                  "<path> §<anchor>" (e.g. "shared/contracts.md §8.9"); never absolute,
#                  no backslashes.
#   applies_to:    session selector — one or more "<kind>:<id>" triggers with kind
#                  stage | command (the shared/bindings.yaml trigger vocabulary);
#                  stage ids must be real registry stages.
#   vintage_floor: earliest perk version the expectation applies to — an "X.Y.Z"
#                  version string, never a date.
#   evidence:      prose — what session evidence satisfies the expectation.
#   violation:     prose — the violation signature (what a breach looks like).
#   tier:          one of: deterministic | judgment
#   enforcement:   one of: prose-only | structural
schema_version: 1
expectations:
  - id: objective-plan.warm-claim-before-authoring
    kind: tool-mechanics
    surface: in-session /objective-plan node claim
    source: prompts/stages/objective-plan/guidance.md
    applies_to:
      - stage:objective-plan
      - command:objective-plan
    vintage_floor: "1.1.0"
    evidence: >-
      A successful objective_node tool call with status "planning" for the selected node
      appears before the session's first plan_draft or plan_review call — the in-session
      claim the approval-driven save uses to link the node.
    violation: >-
      The session authors or reviews the node plan (plan_draft/plan_review) with no prior
      successful objective_node planning claim in the transcript, so the saved plan loses
      its node backlink.
    tier: deterministic
    enforcement: prose-only

  - id: plan.draft-before-review
    kind: workflow-shape
    surface: plan-authoring draft-first review loop
    source: prompts/contexts/plan-authoring.md
    applies_to:
      - stage:plan
      - stage:objective-plan
      - command:objective-plan
    vintage_floor: "1.0.1"
    evidence: >-
      A plan_draft call precedes the session's first plan_review call, and each DENIED
      review is followed by a plan_draft rewrite before any further plan_review call.
    violation: >-
      plan_review is called with no prior plan_draft in the session (riding the legacy
      plan-parameter fallback), or a denied review is re-reviewed without a plan_draft
      rewrite in between.
    tier: deterministic
    enforcement: prose-only

  - id: plan.grill-before-review
    kind: workflow-shape
    surface: pre-review grill interview
    source: skills/perk-plan/SKILL.md
    applies_to:
      - stage:plan
      - stage:objective-plan
      - command:objective-plan
    vintage_floor: "2.1.0"
    evidence: >-
      In an interactive session, at least one ask_user_question round putting real plan
      decisions to the user (with recommendations) occurs before the session's first
      plan_review call — before or after drafting — and the draft is authored, revised,
      or confirmed against the answers. Headless sessions (no interactive user;
      ask_user_question absent) are exempt.
    violation: >-
      An interactive session reaches its first plan_review with no prior grill — no
      ask_user_question round anywhere before review — leaving the plan's decisions
      untested with the user.
    tier: judgment
    enforcement: prose-only

  - id: bindings.nudge-skill-read
    kind: skill-uptake
    surface: skill-binding nudge pointer uptake
    source: shared/contracts.md §8.9
    applies_to:
      - stage:plan
      - stage:gist-author
      - stage:objective-author
      - stage:objective-plan
      - stage:implement
      - stage:address
      - stage:learn
    vintage_floor: "2.0.0"
    evidence: >-
      After a skill binding is delivered — the nudge pointer ("The following skill
      binding(s) apply here:" naming .agents/skills/<skill>/SKILL.md) or the transcluded
      body ("Skill `<skill>` (inlined for …") — the skill body enters the session at any
      point. A transclusion carries the body itself; a nudge is taken up by a read of
      that exact SKILL.md (read tool or read-only bash) or a /skill:<name> invocation of
      the same skill. Workflow skills are prompt-hidden, so those routes are the only
      ways the procedure reaches the session.
    violation: >-
      A nudge pointer is delivered but the named skill body never enters the session — no
      read of the exact SKILL.md path, no /skill:<name> invocation, and no transcluded
      body — so the bound skill's procedure cannot have informed the flow it governs.
    tier: deterministic
    enforcement: prose-only

  - id: engagement.untrusted-as-data
    kind: prompt-adherence
    surface: untrusted-block fencing (objective/engagement reads)
    source: shared/contracts.md §8.25
    applies_to:
      - stage:objective-plan
      - command:objective-plan
      - command:objective-reconcile
    vintage_floor: "1.0.1"
    evidence: >-
      Where an <untrusted_*> block (objective text, node/objective engagement) is present,
      the session weighs its content as data informing judgment; imperatives embedded
      inside the block are never executed as instructions. Attribution is strict: only
      directives originating inside the fenced block count — an action the trusted stage
      guidance independently mandates (e.g. its numbered steps) is not obedience evidence,
      even when the block mentions the same action.
    violation: >-
      The session obeys a directive embedded inside an untrusted block — running a command
      it demands, changing workflow shape because the fenced text says so — rather than
      treating it as content to comprehend; the directive must originate inside the
      fenced block itself, not in the trusted scaffolding around it.
    tier: judgment
    enforcement: prose-only

  - id: address.classifier-child-first
    kind: tool-mechanics
    surface: /address review-feedback classifier child
    source: prompts/stages/address/action.md
    applies_to:
      - stage:address
      - command:address
    vintage_floor: "1.0.1"
    evidence: >-
      The session's review-feedback intake is a subagent launch of perk.review-classifier,
      and the parent applies fixes itself only after the classifier's typed report returns;
      the raw GitHub review payload never enters the parent session.
    violation: >-
      The session fetches and parses raw review feedback itself (e.g. gh api / gh pr view
      of review threads) instead of via the classifier child, or acts on feedback with no
      classifier report in the transcript.
    tier: deterministic
    enforcement: prose-only

  - id: objective-plan.route-explorer-report
    kind: prompt-adherence
    surface: objective-explorer route-don't-relay
    source: skills/perk-objective-plan/SKILL.md
    applies_to:
      - stage:objective-plan
      - command:objective-plan
    vintage_floor: "2.3.0"
    evidence: >-
      When the optional explorer child runs, the parent consumes only the compact
      structured report and its short prose preface, verifying key leads against the repo
      before relying on them; the child's raw exploration transcript never enters the
      parent session.
    violation: >-
      The parent ingests or replays the child's full exploration transcript (beyond the
      returned report fields) into its own context or output.
    tier: judgment
    enforcement: prose-only

  - id: read-only.no-worktree-mutation
    kind: workflow-shape
    surface: read-only session write gate
    source: extension/substrate/toolGating.ts
    applies_to:
      - stage:plan
      - stage:objective-plan
    vintage_floor: "1.0.1"
    evidence: >-
      While the read-only gate is engaged, the transcript contains no successful edit or
      write tool result and no successful bash execution outside the gate's read-only
      allowlist; the only sanctioned writes are the session-data draft tools
      (plan_draft/objective_draft/gist_draft).
    violation: >-
      A successful edit/write tool result or non-allowlisted bash execution while the gate
      is engaged. Scoped to the gate's direct backstop — its accepted, documented
      leniencies (arg-blind curl/agent-browser, unscoped subagent children) are out of
      scope. A hit here should be impossible: it indicts the gate or the audit's session
      classification, not the model.
    tier: deterministic
    enforcement: structural

  - id: plan.learned-docs-first-stop
    kind: prompt-adherence
    surface: docs/learned first-stop consult (plan-stage shapes)
    source: prompts/contexts/plan-authoring.md
    applies_to:
      - stage:plan
      - command:plan
      - stage:objective-plan
      - command:objective-plan
    vintage_floor: "3.2.0"
    evidence: >-
      The session carries a delivered perk-plan or perk-objective-plan binding (the
      borrowed-stage factory doors override their binding and are exempt), and before the
      session's first plan_review call a successful docs/learned consult appears whose
      RESULT entry is an ancestor of that review call: a read of a docs/learned path, a
      grep/find whose path argument targets docs/learned, or a read-only bash reader-led
      segment naming a docs/learned path (a path qualifies iff it lexically resolves
      under the session repository's docs/learned/ — relative from the repo root, or
      absolute under the session header's cwd; ".." escapes and foreign trees'
      docs/learned never count). The stated source is the shared plan-authoring context;
      REPLACE-posture tombell-plan sessions receive the identical first-stop clause via
      prompts/contexts/adapters/tombell-plan.md instead. The ambient cluster index rides
      the system prompt, so the floor is opening the catalog or a doc — a brief stay
      satisfies; relevance judgment (and finding nothing) stays with the model.
    violation: >-
      The session reaches its first plan_review with no docs/learned consult result on
      that call's ancestor chain — the ambient index was never followed into the catalog
      or any learned doc in time to inform the reviewed plan.
    tier: deterministic
    enforcement: prose-only

  - id: objective-author.learned-docs-first-stop
    kind: prompt-adherence
    surface: docs/learned first-stop consult (objective authoring)
    source: prompts/stages/objective-author/seed.md
    applies_to:
      - stage:objective-author
      - command:objective-author
    vintage_floor: "3.2.0"
    evidence: >-
      Same consult evidence as plan.learned-docs-first-stop, gated on a delivered
      perk-objective-author binding — the learn-harvest/learn-dream/objective-replan doors
      borrow this stage with a command binding override and are exempt. The stated surface
      is the bare seed; the adopt.md and file.md launch variants carry the identical
      first-stop clause.
    violation: >-
      An objective-authoring session (perk-objective-author binding delivered) reaches its
      first plan_review with no docs/learned consult result on that call's ancestor chain.
    tier: deterministic
    enforcement: prose-only
