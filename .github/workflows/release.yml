name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The PyPI + npm publish jobs below attach their own `id-token: write` at job scope (OIDC
# trusted publishing / Sigstore provenance); the workflow default stays `contents: read`.
# The GitHub Release job attaches `contents: write` at job scope.
permissions:
  contents: read

jobs:
  validate-release-versions:
    name: validate release versions
    # Reads a `v`-prefixed tag from GITHUB_REF_NAME — meaningless off a tag push.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `tomllib` requires Python >= 3.11 (stdlib).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assert tag matches both plane versions
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          npm=$(jq -r .version package.json)
          if [ "$expected" != "$py" ] || [ "$expected" != "$npm" ]; then
            echo "::error::tag=$expected pyproject=$py package.json=$npm disagree"
            exit 1
          fi
          echo "release version agreed: $expected"

      # Deliberate inline duplicate of the pinned release-header grammar
      # (`## [X.Y.Z] - YYYY-MM-DD`, docs/releasing.md changelog discipline) — stdlib-only
      # python3, matching this job's tomllib step above. Promote to a perk-dev verb only
      # if a third consumer appears.
      - name: Assert the changelog was rolled for the tagged version
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import pathlib, re, sys

          version = sys.argv[1].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}"
          if re.search(pattern, text, re.M) is None:
              print(
                  f"::error::CHANGELOG.md has no rolled `## [{version}] - YYYY-MM-DD` "
                  "section — run `perk-dev bump-version` and re-tag"
              )
              sys.exit(1)
          print(f"changelog rolled for {version}")
          EOF

  build-pypi:
    name: build · check · smoke (PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (+ Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      # `uv build --package perk` produces perk's wheel + sdist into dist/, pinned to the
      # perk workspace member so the never-published `perk-dev` member is never built. The
      # hatchling backend force-includes top-level shared/ → perk/_shared and agents/ → perk/_agents.
      - name: Build wheel + sdist
        run: uv build --package perk

      - name: Validate distributions
        run: uvx twine check dist/*

      # Install the built wheel into an isolated env and run its console script.
      - name: Smoke-test the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          uvx --from "$wheel" perk --help

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    # Production publish — tag pushes only, behind the pypi-publish environment human gate.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-release-versions, build-pypi]
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      # OIDC trusted publishing — no API token. Default packages-dir: dist/.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: publish to TestPyPI (rehearsal)
    # Manual rehearsal only — never on PRs/main/tags.
    if: github.event_name == 'workflow_dispatch'
    needs: [build-pypi]
    runs-on: ubuntu-latest
    environment: testpypi-publish
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      # OIDC trusted publishing against TestPyPI — no API token.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  build-npm:
    name: build · check (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      # `npm pack` validates the manifest + `files` surface and produces the publishable tarball.
      - name: Pack the npm tarball
        run: npm pack

      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: "*.tgz"

  publish-npm:
    name: publish to npm
    # Production publish — tag pushes only, behind the npm-publish environment human gate.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate-release-versions, build-npm]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write   # Sigstore provenance attestation via GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (+ npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: npm ci

      # `npm publish` re-packs from source so provenance is generated at publish time.
      # `--access public` is required for the scoped @mgiles/perk package.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: create GitHub Release
    # The lockstep capstone — only after BOTH planes publish.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release
    steps:
      - uses: actions/checkout@v4

      # Deliberate inline duplicate of the pinned release-header grammar
      # (`## [X.Y.Z] - YYYY-MM-DD`, docs/releasing.md changelog discipline) — stdlib-only
      # python3, matching validate-release-versions' gate. Slices the tagged version's
      # changelog section into release-notes.md; a missing header is defense-in-depth
      # (the validate gate makes it unreachable on this path).
      - name: Slice the changelog section into release notes
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import pathlib, re, sys

          version = sys.argv[1].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = re.search(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}.*$", text, re.M
          )
          if header is None:
              print(f"::error::CHANGELOG.md has no `## [{version}]` release section")
              sys.exit(1)
          rest = text[header.end():]
          following = re.search(r"^## ", rest, re.M)
          section = rest[: following.start()] if following is not None else rest
          pathlib.Path("release-notes.md").write_text(section.strip("\n") + "\n", encoding="utf-8")
          print(f"release notes sliced for {version}")
          EOF

      - name: Create GitHub Release with the curated changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
