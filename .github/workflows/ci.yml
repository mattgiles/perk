name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (+ Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Python deps
        # `--all-packages` installs every workspace member editable (incl. the dev-only
        # `perk-dev`) so `import perk_dev` resolves in the shared test venv.
        run: uv sync --all-packages

      - name: Install Node deps
        run: npm ci

      # Lint: `uv run ruff check src/perk tests` + `npm run lint` (biome check extension docs/site).
      # Deliberately NO `ruff format` here — that is the pre-commit hook's job
      # (see docs/learned/toolchain/ruff.md).
      - name: Lint
        run: just lint

      # Typecheck: `uv run ty check` + `npm run typecheck` (tsc --noEmit) + `npm run
      # docs:typecheck` (docs site: astro sync + tsc --noEmit).
      - name: Typecheck
        run: just typecheck

      # Test: `uv run pytest` + `node --test` over `extension/**/*.test.ts` and the docs-site
      # plugin/sidebar unit tests (`docs/site/src/**/*.test.mjs`) + `npm run docs:check` (static
      # docs build — schema/link/anchor/escape gates — then the post-build corpus/H1/TOC/
      # Expressive-Code/Pagefind checks). Both uv and npm are on PATH so the cross-plane
      # packaging tests in tests/test_packaging.py actually run instead of skipping.
      - name: Test
        run: just test
