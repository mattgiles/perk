[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perk"
dynamic = ["version"]
description = "Plan-oriented engineering workflow for Pi (the CLI exterior / session host)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "perk" }]
dependencies = ["click>=8.1"]

[project.scripts]
perk = "perk.cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "perk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["perk"]

[tool.hatch.build.targets.wheel.force-include]
"shared" = "perk/_shared"

[tool.hatch.build.targets.sdist]
only-include = ["perk", "shared", "README.md"]

# Marks this repository as perk's own source tree. `perk init` reads this to wire
# perk's extension as a local-path package (dev) instead of the published npm package.
[tool.perk]
self = true
