[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perk"
version = "2.0.0"
description = "Plan-oriented engineering workflow for Pi (the CLI exterior / session host)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "perk" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic>=2",
    "python-ulid>=2.7,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
perk = "perk.cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.15.15",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
# Collect only the real suite (faster collection; belt-and-suspenders against the
# `.agents/cache` clone even though pytest's default `.*` norecursedirs already excludes it).
testpaths = ["tests"]
# Parallelize across logical CPUs by default (local and CI). `loadgroup` distributes per-test
# by load EXCEPT for tests sharing an `@pytest.mark.xdist_group(...)`, which are pinned to one
# worker (used by the wheel-build sharing in tests/test_packaging.py).
# Debug serially by overriding on the CLI: `uv run pytest -n0 ...`.
addopts = "-n auto --dist loadgroup"

[tool.hatch.build.targets.wheel]
# `src/perk` — hatchling strips the `src/` prefix, so the wheel still contains `perk/…`.
packages = ["src/perk"]

[tool.hatch.build.targets.wheel.force-include]
"shared" = "perk/_shared"
"agents" = "perk/_agents"
"prompts" = "perk/_prompts"
"CHANGELOG.md" = "perk/_data/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
only-include = ["src/perk", "shared", "agents", "prompts", "README.md", "CHANGELOG.md"]

# Workspace root: `perk` (this [project]) is the root member; additional members
# live under packages/*. The glob currently matches nothing (packages/ arrives with
# a later node); a modern uv treats a zero-match member glob as "root is the sole member".
[tool.uv.workspace]
members = ["packages/*"]

# Marks this repository as perk's own source tree. `perk init` reads this to wire
# perk's extension as a local-path package (dev) instead of the published npm package.
[tool.perk]
self = true

[tool.ty.environment]
python-version = "3.13"
# `src` resolves `from perk...` (the package lives at src/perk); `packages/perk-dev/src` resolves
# `import perk_dev`; `tests` resolves the bare-name cross-test-module imports (e.g. `from
# _linear_fakes import _FakeLinear`) the way pytest does at runtime (prepend import mode, no
# `tests/__init__.py`).
root = ["src", "packages/perk-dev/src", "tests"]

[tool.ty.src]
# Only type-check perk's own code (incl. the dev-only perk-dev workspace member).
include = ["src/perk", "packages/perk-dev/src/perk_dev", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Only lint/format perk's own code (incl. the dev-only perk-dev workspace member).
include = ["src/perk/**/*.py", "packages/perk-dev/src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLW1514", "PTH", "PLR1702", "PLC0415"]
# Activate only the explicitly selected preview rules (PLW1514/PLR1702/PLC0415);
# stable rules keep their stable behavior.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Test-local imports are idiomatic (fixtures, monkeypatch targets).
"tests/**" = ["PLC0415"]
