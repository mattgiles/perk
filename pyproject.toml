[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perk"
dynamic = ["version"]
description = "Plan-oriented engineering workflow for Pi (the CLI exterior / session host)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "perk" }]
dependencies = [
    "click>=8.1",
    "python-ulid>=2.7,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
perk = "perk.cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.15",
    "ty>=0.0.1",
]

[tool.hatch.version]
path = "perk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["perk"]

[tool.hatch.build.targets.wheel.force-include]
"shared" = "perk/_shared"

[tool.hatch.build.targets.sdist]
only-include = ["perk", "shared", "README.md"]

# Marks this repository as perk's own source tree. `perk init` reads this to wire
# perk's extension as a local-path package (dev) instead of the published npm package.
[tool.perk]
self = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# Only type-check perk's own code, never the vendored .prior-art/ tree.
include = ["perk", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Only lint/format perk's own code, never the vendored .prior-art/ tree.
include = ["perk/**/*.py", "tests/**/*.py"]
extend-exclude = [".prior-art"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLW1514", "PTH", "PLR1702", "PLC0415"]
# Activate only the explicitly selected preview rules (PLW1514/PLR1702/PLC0415);
# stable rules keep their stable behavior.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Test-local imports are idiomatic (fixtures, monkeypatch targets).
"tests/**" = ["PLC0415"]
