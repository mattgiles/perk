# Configuration for `prek` (a fast, drop-in pre-commit reimplementation).
# See https://prek.j178.dev — run `prek install` (folded into `just setup`) to wire the
# git pre-commit shim. The ruff env is built by prek itself via the remote ruff-pre-commit
# repo, so the hook never depends on a system/`.venv` ruff being on PATH.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
# Pinned in lockstep with the `dev` group ruff floor in pyproject.toml. `prek auto-update`
# can bump this, but it won't read pyproject.toml — keep the two aligned by hand.
rev = "v0.15.15"
hooks = [
    # Plain lint check (no --fix, no format): the hook reports, it does not mutate files.
    # ruff auto-discovers pyproject.toml; --config is explicit but redundant.
    { id = "ruff-check", types_or = ["python", "pyi"], args = ["--config", "pyproject.toml"] },
]
