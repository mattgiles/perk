    priority: 85
  - id: ts-audit
    match: { paths: ["extension/pi/v1/learning/audit.ts"] }
    capability: knowledge.audit
    audience: self-development
    role: tool-contract
    priority: 90
  - id: ts-submit
    match: { paths: ["extension/pi/v1/delivery/submit.ts", "extension/pi/v1/delivery/ready.ts", "extension/pi/v1/delivery/ci.ts"] }
    capability: delivery.submit
    audience: shipped
    role: tool-contract
    priority: 85
  - id: ts-land
    match: { paths: ["extension/pi/v1/delivery/land.ts"] }
    capability: delivery.land
    audience: shipped
    role: tool-contract
    priority: 85
  - id: ts-objective-delivery
    match: { paths: ["extension/pi/v1/delivery/stackStatus.ts", "extension/pi/v1/delivery/stackSync.ts", "extension/pi/v1/delivery/stackRecover.ts", "extension/pi/v1/delivery/stackLand.ts", "extension/pi/v1/delivery/stackDrive.ts"] }
    capability: delivery.objective
    audience: shipped
    role: tool-contract
    priority: 90
  - id: ts-implement
    match: { paths: ["extension/worker/**", "extension/hunkFeedback/receiver.ts"] }
    capability: delivery.implement
    audience: shipped
    role: control-guidance
    priority: 80
  - id: ts-agent-scratch
    match: { paths: ["extension/substrate/agentScratch.ts"] }
    capability: foundation.tools
    audience: shipped
    role: context
    priority: 100
  - id: ts-session
    match: { paths: ["extension/pi/v1/delivery/commitCompact.ts", "extension/doors/lifecycleGates.ts", "extension/substrate/bindingDelivery.ts", "extension/substrate/toolGating.ts"] }
    capability: foundation.session
    audience: shipped
    role: context
    priority: 85
exclusions:
  - id: prompt-documentation
    match: { ids: ["markdown:prompts/README.md"] }
    reason: Human documentation for prompt authors, not model-delivered prose.
  - id: prompt-fixtures
    match: { paths: ["prompts/_fixtures/**"] }
    reason: Renderer fixtures and pins, never runtime prompt assets.
  - id: borrowed-btw
    match: { paths: ["extension/vendor/btw/**"] }
    reason: Borrowed side-chat implementation; represented as an external assembly boundary.

session_shapes:
  - { id: plan.cold, capability: planning.plan, label: Plan authoring — cold door, delivery: cold, trigger: "perk plan", assembly: plan-authoring }
  - { id: plan.warm, capability: planning.plan, label: Plan authoring — warm door, delivery: warm, trigger: "/plan", assembly: plan-authoring }
  - { id: gist.cold, capability: intent.gist, label: Gist authoring — cold door, delivery: cold, trigger: "perk gist author", assembly: gist-authoring }
  - { id: objective.cold, capability: intent.objective, label: Objective authoring — cold door, delivery: cold, trigger: "perk objective author", assembly: objective-authoring }
  - { id: objective.warm, capability: intent.objective, label: Objective authoring — warm door, delivery: warm, trigger: "/objective-author", assembly: objective-authoring }
  - { id: objective-plan.cold, capability: planning.objective, label: Objective-node planning — cold door, delivery: cold, trigger: "perk objective plan", assembly: objective-planning }
  - { id: objective-plan.warm, capability: planning.objective, label: Objective-node planning — warm door, delivery: warm, trigger: "/objective-plan", assembly: objective-planning }
  - { id: implement.cold, capability: delivery.implement, label: Implementation — interactive cold door, delivery: cold, trigger: "perk implement", assembly: implementation }
  - { id: implement.headless, capability: delivery.implement, label: Implementation — headless worker, delivery: headless, trigger: "perk implement --remote", assembly: implementation }
  - { id: address.cold, capability: review.address, label: Address — cold door, delivery: cold, trigger: "perk pr address", assembly: address }
  - { id: address.warm, capability: review.address, label: Address — warm door, delivery: warm, trigger: "/address", assembly: address }
  - { id: pr-review.warm, capability: review.pr, label: Automated PR review, delivery: warm, trigger: "/pr-review", assembly: pr-review }
  - { id: pr-review.child, capability: review.pr, label: PR reviewer child, delivery: subagent, trigger: "run_pr_review_wave", assembly: pr-review-child }
  - { id: learn.cold, capability: knowledge.learn, label: Learn — cold door, delivery: cold, trigger: "perk learn", assembly: learn }
  - { id: learn.warm, capability: knowledge.learn, label: Learn — warm door, delivery: warm, trigger: "/learn", assembly: learn }
  - { id: skills.cold, capability: extension.skills, label: Skill authoring, delivery: cold, trigger: "perk skills create/refine", assembly: skill-authoring }

assemblies:
  - id: plan-authoring
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/contexts/plan-authoring.md", label: Plan-authoring flow }
      - { unit: "markdown:skills/perk-plan/SKILL.md", label: Bound plan skill }
      - { unit: "typescript-tool:plan_draft", label: Working draft contract, optional: true }
      - { unit: "typescript-tool:plan_review", label: Review contract, optional: true }
      - { boundary: user-content, label: Human request and answers }
  - id: gist-authoring
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/gist-author/seed.md", label: Cold launch statement }
      - { unit: "markdown:prompts/contexts/gist-authoring.md", label: Authoring flow }
      - { unit: "markdown:skills/perk-gist-author/SKILL.md", label: Bound gist skill }
      - { boundary: user-content, label: Human intent }
  - id: objective-authoring
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/objective-author/seed.md", label: Cold launch statement, optional: true }
      - { unit: "markdown:prompts/contexts/objective-authoring.md", label: Objective-authoring flow }
      - { unit: "markdown:skills/perk-objective-author/SKILL.md", label: Bound objective skill }
      - { unit: "typescript-tool:objective_draft", label: Structured draft contract, optional: true }
      - { boundary: user-content, label: Human objective intent }
  - id: objective-planning
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/objective-plan/seed.md", label: Cold launch statement, optional: true }
      - { unit: "markdown:prompts/stages/objective-plan/guidance.md", label: Warm guidance, optional: true }
      - { unit: "markdown:skills/perk-objective-plan/SKILL.md", label: Bound factory skill }
      - { boundary: runtime-state, label: Objective and selected-node state }
      - { boundary: user-content, label: Human planning decisions }
  - id: implementation
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/implement.md", label: Implementation launch statement }
      - { unit: "markdown:skills/perk-implement/SKILL.md", label: Bound implementation skill }
      - { boundary: runtime-state, label: Active plan and worktree state }
      - { boundary: user-content, label: Human steering }
  - id: address
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/address/action.md", label: Action launch statement }
      - { unit: "markdown:skills/perk-address/SKILL.md", label: Bound address skill }
      - { unit: "typescript-tool:classify_review_feedback", label: Isolated classification contract }
      - { unit: "typescript-tool:finalize_address", label: Publish-and-resolve finalizer }
      - { boundary: user-content, label: Human steering }
  - id: pr-review
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/pr-review.md", label: Parent review flow }
      - { unit: "markdown:skills/perk-pr-review/SKILL.md", label: Bound review skill }
      - { unit: "typescript-tool:run_pr_review_wave", label: Reviewer-wave contract }
      - { unit: "typescript-tool:post_pr_review", label: Reconciled posting contract }
      - { boundary: user-content, label: Optional review focus }
  - id: pr-review-child
    layers:
      - { boundary: pi-system, label: Child-session engine contract }
      - { unit: "markdown:agents/pr-reviewer.md", label: Reviewer definition }
      - { boundary: runtime-state, label: Assigned angle and fetched diff/plan data }
  - id: learn
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/learn.md", label: Learn launch statement }
      - { unit: "markdown:skills/perk-learn/SKILL.md", label: Bound learning skill }
      - { unit: "typescript-tool:run_learn_wave", label: Analyst-wave contract, optional: true }
      - { boundary: runtime-state, label: "Landed plan, diff, and transcript evidence" }
  - id: skill-authoring
    layers:
      - { boundary: pi-system, label: Pi system and host policy }
      - { unit: "markdown:prompts/stages/skills/create.md", label: Create launch statement, optional: true }
      - { unit: "markdown:prompts/stages/skills/refine.md", label: Refine launch statement, optional: true }
      - { unit: "managed:skill-scaffold", label: Initial repository skill scaffold, optional: true }
      - { unit: "markdown:skills/perk-skill-author/SKILL.md", label: Bound skill-authoring detail }
      - { boundary: user-content, label: Requested capability and source material }

scenarios:
  - id: plan-github-warm
    assembly: plan-authoring
    label: GitHub-backed warm planning
    variables:
      provider: "github"
      marker: "[PLAN AUTHORING]"
    include_ambient: true
    include_tools: true
  - id: plan-linear-cold
    assembly: plan-authoring
    label: Linear-backed cold planning
    variables:
