concerns:
  - id: review-first-save
    label: Review-first save
    summary: Authoring judgment remains in the reviewed draft; persistence is a terminating mechanical boundary.
    canonical_unit: "markdown:prompts/contexts/plan-authoring.md"
    related:
      - { unit: "markdown:skills/perk-plan/SKILL.md", relation: Detailed authoring and fallback policy. }
      - { unit: "typescript-tool:plan_review", relation: Model-visible review and auto-save contract. }
      - { unit: "typescript-tool:plan_save", relation: Mechanical persistence surface. }
  - id: untrusted-data
    label: Untrusted data framing
    summary: Repository, issue, diff, and reviewer text are treated as data rather than instructions.
    canonical_unit: "markdown:agents/pr-reviewer.md"
    related:
      - { unit: "markdown:prompts/stages/pr-review.md", relation: Parent workflow framing. }
      - { unit: "typescript-tool:run_pr_review_wave", relation: Aggregate report framing. }
      - { unit: "typescript-tool:classify_review_feedback", relation: Review-input classification framing. }
      - { unit: "python-symbol:src/perk/cli/seed_file.py:render_seed_file_scratch", relation: Shared local-file seed fence. }
      - { unit: "python-symbol:src/perk/cli/commands/plan/from_cmd.py:_render_source_issue", relation: Adopted plan-source fence. }
      - { unit: "python-symbol:src/perk/cli/commands/plan/replan_cmd.py:_render_existing_plan", relation: Existing-plan reauthoring fence. }
      - { unit: "python-symbol:src/perk/cli/commands/objective/author_cmd.py:_render_source", relation: Adopted objective-source fence. }
      - { unit: "python-symbol:src/perk/cli/commands/objective/replan_cmd.py:_render_existing_objective", relation: Existing-objective reauthoring fence. }
      - { unit: "python-symbol:src/perk/cli/commands/learn/factory_common.py:render_inbox", relation: Learning-inbox fence. }
      - { unit: "python-symbol:src/perk/learn/normalize.py:_PREAMBLE", relation: Normalized session-evidence fence. }
      - { unit: "python-symbol:packages/perk-dev/src/perk_dev/audit/bounding.py:_PREAMBLE", relation: Self-development audit-evidence fence. }
      - { unit: "python-symbol:src/perk/backends/engagement.py:render_node_engagement", relation: Node-engagement fence. }
      - { unit: "python-symbol:src/perk/backends/engagement.py:render_plan_engagement", relation: Plan-engagement fence. }
      - { unit: "python-symbol:src/perk/backends/engagement.py:render_adopted_engagement", relation: Adopted-source engagement fence. }
      - { unit: "python-symbol:src/perk/backends/engagement.py:render_objective_engagement", relation: Aggregate objective-engagement fence. }
  - id: route-dont-relay
    label: Route, don't relay
    summary: Parent workflows assign bounded work and consume typed reports without hand-transcribing child prompts.
    canonical_unit: "markdown:skills/perk-learn/SKILL.md"
    related:
      - { unit: "typescript-tool:run_learn_wave", relation: Code-owned analyst wave. }
      - { unit: "typescript-tool:run_pr_review_wave", relation: Code-owned reviewer wave. }
      - { unit: "markdown:agents/learn-analyst.md", relation: Bounded child contract. }

lineage:
  - id: delivered-skills
    source: "markdown:skills/**"
    relationship: materializes-to
    targets: [".agents/skills/<skill>/"]
  - id: delivered-agents
    source: "markdown:agents/*.md"
    relationship: materializes-to
    targets: [".pi/agents/perk/<agent>.md"]
  - id: ambient-index
    source: "ambient:learned-routing"
    relationship: materializes-to
    targets: [".pi/APPEND_SYSTEM.md"]
  - id: downstream-agents
    source: "managed:downstream-agents"
    relationship: materializes-to
    targets: ["AGENTS.md managed block in initialized repositories"]
  - id: repository-skill-scaffold
    source: "managed:skill-scaffold"
    relationship: materializes-to
    targets: [".perk/skills/<name>/SKILL.md"]
  - id: packaged-prompts
    source: "markdown:prompts/**/*.md"
    relationship: bundled-as
    targets: ["perk/_prompts in the Python wheel", "prompts/ in the npm package"]
