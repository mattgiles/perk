    audience: shipped
    role: launch
    priority: 90
  - id: prompt-stack-review
    match: { paths: ["prompts/stages/stack-review/**", "prompts/stages/stack-review-browser/**"] }
    capability: review.pr
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-address
    match: { paths: ["prompts/stages/address/**"] }
    capability: review.address
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-implement
    match: { paths: ["prompts/stages/implement.md", "prompts/stages/conflict-resolution.md"] }
    capability: delivery.implement
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-conflict-continuation
    match: { paths: ["prompts/stages/conflict-resolution-continuation.md"] }
    capability: delivery.objective
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-objective-delivery
    match: { paths: ["prompts/stages/objective-land.md", "prompts/stages/objective-recover.md", "prompts/stages/objective-sync.md", "prompts/stages/objective-reconcile.md", "prompts/stages/objective-reconcile-ready.md"] }
    capability: delivery.objective
    audience: shipped
    role: control-guidance
    priority: 90
  - id: prompt-learn
    match: { paths: ["prompts/stages/learn*.md"] }
    capability: knowledge.learn
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-audit
    match: { paths: ["prompts/stages/audit.md"] }
    capability: knowledge.audit
    audience: self-development
    role: launch
    priority: 95
  - id: prompt-skills
    match: { paths: ["prompts/stages/skills/**"] }
    capability: extension.skills
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-session
    match: { paths: ["prompts/contexts/read-only.md", "prompts/common/resume-advisory.md", "prompts/commit-and-compact.md", "prompts/commit-and-compact-continuation.md"] }
    capability: foundation.session
    audience: shipped
    role: context
    priority: 90
  - id: prompt-fallback
    match: { paths: ["prompts/**/*.md"] }
    capability: foundation.session
    audience: shipped
    role: context
    priority: 1

  - id: skill-intent-gist
    match: { paths: ["skills/perk-gist-author/**"] }
    capability: intent.gist
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-intent-objective
    match: { paths: ["skills/perk-objective-author/**"] }
    capability: intent.objective
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-objective-planning
    match: { paths: ["skills/perk-objective-plan/**", "skills/perk-objective-replan/**", "skills/perk-objective-reconcile/**"] }
    capability: planning.objective
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-plan
    match: { paths: ["skills/perk-plan/**", "skills/perk-replan/**"] }
    capability: planning.plan
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-implement
    match: { paths: ["skills/perk-implement/**"] }
    capability: delivery.implement
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-review
    match: { paths: ["skills/perk-grill/**", "skills/perk-plan-review-browser/**", "skills/perk-objective-review-browser/**", "skills/perk-pr-review*/**"] }
    capability: review.pr
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-address
    match: { paths: ["skills/perk-address/**"] }
    capability: review.address
    audience: shipped
    role: skill-detail
    priority: 85
  - id: skill-learn
    match: { paths: ["skills/perk-learn*/**"] }
    capability: knowledge.learn
    audience: shipped
    role: skill-detail
    priority: 80
  - id: skill-domain
    match: { paths: ["skills/perk-domain-modeling/**"] }
    capability: knowledge.domain
    audience: both
    role: skill-detail
    priority: 85
  - id: skill-authoring
    match: { paths: ["skills/perk-skill-author/**"] }
    capability: extension.skills
    audience: shipped
    role: skill-detail
    priority: 85
  - id: skill-utilities
    match: { paths: ["skills/perk-expert/**", "skills/ast-grep/**"] }
    capability: extension.utilities
    audience: both
    role: skill-detail
    priority: 80

  - id: agent-review
    match: { paths: ["agents/*review*.md"] }
    capability: review.pr
    audience: shipped
    role: subagent-instruction
    priority: 85
  - id: agent-conflict
    match: { paths: ["agents/conflict-resolver.md"] }
    capability: delivery.implement
    audience: shipped
    role: subagent-instruction
    priority: 85
  - id: agent-objective
    match: { paths: ["agents/objective-explorer.md"] }
    capability: planning.objective
    audience: shipped
    role: subagent-instruction
    priority: 85
  - id: agent-learn
    match: { paths: ["agents/learn-analyst.md", "agents/harvest-analyst.md", "agents/dream-analyst.md", "agents/dream-reducer.md"] }
    capability: knowledge.learn
    audience: shipped
    role: subagent-instruction
    priority: 85

  - id: py-plan-seed-data
    match: { paths: ["src/perk/cli/seed_file.py", "src/perk/cli/commands/plan/from_cmd.py"] }
    capability: planning.plan
    audience: shipped
    role: context
    priority: 90
  - id: py-plan-replan-data
    match: { paths: ["src/perk/cli/commands/plan/replan_cmd.py"] }
    capability: planning.replan
    audience: shipped
    role: context
    priority: 90
  - id: py-objective-author-data
    match: { paths: ["src/perk/cli/commands/objective/author_cmd.py"] }
    capability: intent.objective
    audience: shipped
    role: context
    priority: 90
  - id: py-objective-plan-data
    match: { paths: ["src/perk/cli/commands/objective/plan_cmd.py"] }
    capability: planning.objective
    audience: shipped
    role: context
    priority: 90
  - id: py-objective-replan-data
    match: { paths: ["src/perk/cli/commands/objective/replan_cmd.py"] }
    capability: planning.replan
    audience: shipped
    role: context
    priority: 90
  - id: py-engagement-data
    match: { paths: ["src/perk/backends/engagement.py"] }
    capability: foundation.session
    audience: shipped
    role: context
    priority: 90
  - id: py-learn-data
    match: { paths: ["src/perk/cli/commands/learn/factory_common.py", "src/perk/learn/normalize.py"] }
    capability: knowledge.learn
    audience: shipped
    role: context
    priority: 90
  - id: py-audit-data
    match: { paths: ["packages/perk-dev/src/perk_dev/audit/bounding.py"] }
    capability: knowledge.audit
    audience: self-development
    role: context
    priority: 90

  - id: ts-adapters
    match: { paths: ["extension/pi/v1/providers/**"] }
    capability: review.drafts
    audience: shipped
    role: adapter
    priority: 80
  - id: ts-gist
    match: { paths: ["extension/authoring/gist/**", "extension/pi/v1/gist.ts"] }
    capability: intent.gist
    audience: shipped
    role: control-guidance
    priority: 80
  - id: ts-objective-plan
    match: { paths: ["extension/pi/v1/objectivePlanning.ts"] }
    capability: planning.objective
    audience: shipped
    role: tool-contract
    priority: 85
  - id: ts-objective-author
    match: { paths: ["extension/pi/v1/objective.ts", "extension/pi/v1/objectiveAuthoring.ts", "extension/authoring/objective/**"] }
    capability: intent.objective
    audience: shipped
    role: tool-contract
    priority: 75
  - id: ts-plan-review
    match: { paths: ["extension/pi/v1/planReview.ts", "extension/pi/v1/objectiveReview.ts", "extension/pi/v1/review.ts", "extension/doors/planReviewBrowser.ts", "extension/doors/objectiveReviewBrowser.ts", "extension/doors/plannotatorHandoff.ts", "extension/doors/draftReviewWaveTools.ts"] }
    capability: review.drafts
    audience: shipped
    role: tool-contract
    priority: 90
  - id: ts-plan-review-tool
    # The plan_review registration rides pi/v1/plan.ts (the one installer), so the review
    # door's tool unit is routed by unit id, not by the shared installer path.
    match: { ids: ["typescript-tool:plan_review"] }
    capability: review.drafts
    audience: shipped
    role: tool-contract
    priority: 90
  - id: ts-plan
    match: { paths: ["extension/pi/v1/plan.ts", "extension/pi/v1/planTitle.ts", "extension/authoring/plan/**"] }
    capability: planning.plan
    audience: shipped
    role: tool-contract
    priority: 75
  - id: ts-address
    match: { paths: ["extension/pi/v1/delivery/address.ts"] }
    capability: review.address
    audience: shipped
    role: tool-contract
    priority: 90
  - id: ts-pr-review
    match: { paths: ["extension/doors/*Review*.ts", "extension/codeReview/**", "extension/pi/v1/codeReview/**", "extension/pi/v1/providers/annotations.ts", "extension/waves/**"] }
