schema_version: 1

# Human capabilities are the primary information architecture. Registry stages and command names
# are evidence for the map, not its top-level taxonomy.
capabilities:
  - id: foundation
    label: Foundation
    summary: Cross-cutting model-context composition, routing, guardrails, and session utilities.
  - id: foundation.ambient
    parent: foundation
    label: Ambient routing
    summary: Discovery cues and managed instructions present before a workflow is selected.
  - id: foundation.session
    parent: foundation
    label: Session posture
    summary: Read-only posture, continuation, compaction, and shared lifecycle guidance.
  - id: foundation.tools
    parent: foundation
    label: Shared tool contracts
    summary: Model-visible tools and injected controls shared across workflow families.

  - id: intent
    label: Intent
    summary: Capture and preserve problem-space intent before implementation planning.
  - id: intent.gist
    parent: intent
    label: Gists
    summary: Draft, review, save, and adopt lightweight statements of intent.
  - id: intent.objective
    parent: intent
    label: Objectives
    summary: Author and save objectives and their roadmaps.

  - id: planning
    label: Planning
    summary: Turn intent and repository evidence into decision-complete implementation plans.
  - id: planning.objective
    parent: planning
    label: Objective-node planning
    summary: Select, explore, and plan the next objective roadmap node.
  - id: planning.plan
    parent: planning
    label: Plan authoring
    summary: Explore, draft, adopt, review, and save a bounded implementation plan.
  - id: planning.replan
    parent: planning
    label: Replanning
    summary: Supersede plans or objectives while preserving their durable relationships.

  - id: delivery
    label: Delivery
    summary: Execute reviewed plans and move their changes through the pull-request lifecycle.
  - id: delivery.implement
    parent: delivery
    label: Implementation
    summary: Implement a plan, resolve conflicts, and maintain implementation-session discipline.
  - id: delivery.submit
    parent: delivery
    label: Submission and readiness
    summary: Validate, publish, and prepare changes for review and landing.
  - id: delivery.land
    parent: delivery
    label: Landing
    summary: Merge changes and drive their immediate post-merge handoffs.
  - id: delivery.objective
    parent: delivery
    label: Objective delivery control
    summary: Synchronize, recover, land, and reconcile multi-plan objective delivery.

  - id: review
    label: Review
    summary: Stress-test drafts and changes, reconcile findings, and close review loops.
  - id: review.drafts
    parent: review
    label: Draft review
    summary: Human and agent review surfaces for gists, objectives, and plans.
  - id: review.pr
    parent: review
    label: Pull-request review
    summary: Automated, terminal, and browser PR-review families.
  - id: review.address
    parent: review
    label: Addressing feedback
    summary: Classify review feedback, fix actionable items, publish, and resolve.

  - id: knowledge
    label: Knowledge
    summary: Capture, route, consolidate, and mine durable learning from completed work.
  - id: knowledge.learn
    parent: knowledge
    label: Learning factories
    summary: Capture learnings and route them into documentation, code, or harvested objectives.
  - id: knowledge.audit
    parent: knowledge
    label: Session audit
    summary: Judge self-development session evidence with isolated auditor workflows.
  - id: knowledge.domain
    parent: knowledge
    label: Domain modeling
    summary: Maintain shared terminology and durable design decisions.

  - id: extension
    label: Extension & utilities
    summary: Extend perk's own agent capabilities and support bounded model-facing utilities.
  - id: extension.skills
    parent: extension
    label: Skill authoring
    summary: Create and refine repository-owned skills.
  - id: extension.utilities
    parent: extension
    label: Expert and utility skills
    summary: Expert configuration guidance, structural search, and ancillary model utilities.

# Discovery emits stable units and logical child fragments. The highest-priority matching route
# supplies semantic placement; equal-priority ties are validation errors.
routes:
  - id: managed-ambient
    match: { ids: ["managed:downstream-agents", "ambient:learned-routing"] }
    capability: foundation.ambient
    audience: shipped
    role: ambient-discovery
    priority: 100
  - id: repo-agents
    match: { ids: ["managed:repo-agents"] }
    capability: foundation.ambient
    audience: self-development
    role: ambient-discovery
    priority: 100
  - id: managed-skill-scaffold
    match: { ids: ["managed:skill-scaffold"] }
    capability: extension.skills
    audience: shipped
    role: skill-detail
    priority: 100

  - id: prompt-gist
    match: { paths: ["prompts/contexts/gist-authoring.md", "prompts/stages/gist-*/**"] }
    capability: intent.gist
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-objective-author
    match: { paths: ["prompts/contexts/objective-authoring.md", "prompts/stages/objective-author/**", "prompts/stages/objective-save.md"] }
    capability: intent.objective
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-objective-plan
    match: { paths: ["prompts/stages/objective-plan/**", "prompts/common/objective-read/**"] }
    capability: planning.objective
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-replan
    match: { paths: ["prompts/stages/replan.md", "prompts/stages/objective-replan.md"] }
    capability: planning.replan
    audience: shipped
    role: launch
    priority: 90
  - id: prompt-plan
    match: { paths: ["prompts/contexts/plan-authoring.md", "prompts/stages/plan-from/**", "prompts/common/plan-read/**"] }
    capability: planning.plan
    audience: shipped
    role: launch
    priority: 80
  - id: prompt-draft-review
    match: { paths: ["prompts/contexts/adapters/**", "prompts/stages/*review-browser.md", "prompts/stages/plan-review-browser.md"] }
    capability: review.drafts
    audience: shipped
    role: adapter
    priority: 95
  - id: prompt-pr-review
