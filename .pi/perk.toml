# perk project config (committed). Edit freely; per-user overrides go in
# .pi/perk.local.toml (gitignored). The schema grows as perk does.

[worktree]
# Where `perk worktree create` and cold-door stages place worktrees.
# Relative paths resolve against the repo root.
root = ".worktrees"

# perk's own dogfood CI checks (P2.T5). The `run_ci` tool / `/ci` command run these named checks
# and REPORT pass/fail — they never edit or fix. Project-supplied CI is untrusted by default: an
# interactive session prompts to confirm (per-session latch), and headless runs need
# `--allow-project-ci` — unless `[trust] ci = "true"` below opts the whole repo in.
[ci]
lint = "just lint"
typecheck = "just typecheck"
test = "just test"

[trust]
# This is our own repo — run the [ci] checks above without a per-session confirm.
ci = "true"

[subagents]
pr-reviewer = "google/gemini-3.5-flash"
review-classifier = "google/gemini-3.5-flash"
objective-explorer = "google/gemini-3.5-flash"

# Repo-local planning addendum (#187). Appended to PLAN_AUTHORING_CONTEXT by the TS planMode
# injection during every read-only planning session (plan, replan, objective-plan) — it coexists
# with the shipped `perk-plan` skill nudge rather than overriding it. Ignored by the Python
# `tomllib` config reader (valid TOML it doesn't extract).
[workflow]
plan_authoring = """
Before finalizing the plan, follow the `grill-with-docs` skill: interview the user one question at a
time (waiting for each answer before the next), stress-testing the plan against the codebase and the
project's documented language/decisions, and provide your recommended answer for each question. Use
the `ask_user_question` tool to ask — one focused question per call. Prefer exploring the codebase
over asking when a question is answerable from the code.
"""

[providers]
plan = "plannotator-plan"
